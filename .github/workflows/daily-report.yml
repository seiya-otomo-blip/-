name: 日次レポート (Daily Report)

on:
  schedule:
    # 平日 18:00 JST (= 09:00 UTC, UTC+9)
    - cron: '0 9 * * 1-5'
  workflow_dispatch:  # 手動実行用

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Daily Report via Claude Code
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: >
            mcp__Slack__slack_search_public_and_private,
            mcp__Slack__slack_send_message,
            mcp__Slack__slack_search_users,
            mcp__Slack__slack_read_channel,
            mcp__Gmail__search_threads,
            mcp__Gmail__get_thread,
            mcp__Google-Calendar__list_events,
            mcp__Google-Calendar__list_calendars
          # MCP サーバー設定（各サービスの認証情報は GitHub Secrets に登録すること）
          # 下記は使用する MCP サーバーパッケージに合わせて編集してください
          mcp_config: |
            {
              "mcpServers": {
                "Slack": {
                  "command": "npx",
                  "args": ["-y", "@modelcontextprotocol/server-slack"],
                  "env": {
                    "SLACK_BOT_TOKEN": "${{ secrets.SLACK_BOT_TOKEN }}",
                    "SLACK_TEAM_ID": "${{ secrets.SLACK_TEAM_ID }}"
                  }
                },
                "Gmail": {
                  "command": "npx",
                  "args": ["-y", "mcp-server-gmail"],
                  "env": {
                    "GMAIL_CREDENTIALS_JSON": "${{ secrets.GMAIL_CREDENTIALS_JSON }}"
                  }
                },
                "Google-Calendar": {
                  "command": "npx",
                  "args": ["-y", "mcp-server-google-calendar"],
                  "env": {
                    "GOOGLE_CREDENTIALS_JSON": "${{ secrets.GOOGLE_CREDENTIALS_JSON }}"
                  }
                }
              }
            }
          prompt: |
            あなたは日次レポート作成アシスタントです。本日の活動を収集し、時系列にまとめてSlack DMに送信してください。

            TODAY=$(date '+%Y/%m/%d')
            TODAY_ISO=$(date '+%Y-%m-%d')

            ## 実行手順

            ### 1. Googleカレンダーのスケジュールを取得
            - 今日のカレンダーイベントを全て取得する（timeMin: 今日T00:00:00+09:00, timeMax: 今日T23:59:59+09:00）
            - 各イベントの開始時刻・終了時刻・タイトル・参加者を記録する

            ### 2. Slackの自分の投稿を取得
            - ユーザーID: U01SC3UBKMX (seiya-otomo)
            - 今日の自分の投稿を検索する (クエリ: 'from:@seiya-otomo after:今日のISO日付')
            - 各投稿のチャンネル名・時刻・内容の要約を記録する

            ### 3. Gmailの返信・送受信メールを取得
            - 今日受信したメール: 'after:今日のISO日付 in:inbox'
            - 今日送信したメール: 'after:今日のISO日付 in:sent'
            - 各メールの時刻・件名・送信者/宛先を記録する

            ### 4. 日次レポートを作成してSlack DMに送信
            上記を全て時刻順に並べ替えて、以下のフォーマットで seiya-otomo (user_id: U01SC3UBKMX) へ Slack DM を送信してください。

            ---
            【日次レポート】YYYY/MM/DD

            📅 *カレンダー*
            HH:MM〜HH:MM イベント名（参加者: 名前, ...）

            💬 *Slack投稿*
            HH:MM [#チャンネル名] 投稿内容の要約

            📧 *Gmail*
            HH:MM 受信: 件名 （from: 送信者）
            HH:MM 送信: 件名 （to: 宛先）

            ━━━━━━━━━━━━━━
            本日もお疲れ様でした 🎉
            ---

            必ず最後に Slack DM を user_id U01SC3UBKMX へ送信すること。
